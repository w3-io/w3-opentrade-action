kind: integration
partner: opentrade
name: OpenTrade Yield Vaults
version: 0.1.0
repo: w3-io/w3-opentrade-action

description: >
  Stablecoin yield from US Treasuries, money market funds, and corporate bonds via OpenTrade ERC-4626 vaults. Deposit, redeem, and monitor across Ethereum, Avalanche, and Plume.


context: >
  Use OpenTrade when a workflow needs institutional-grade stablecoin yield. Idle USDC/USDT earns T-bill or MMF returns through regulated, bankruptcy-remote structures. KYC required for deposits.


commands:
  - name: deposit
    description: Deposit stablecoins into a vault. Auto-approves. Requires KYC.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
      amount: { type: string, required: true, description: Amount in underlying base units }
    outputs:
      result: { type: object, description: Transaction receipt with from, txHash }

  - name: request-redeem
    description: Request redemption of vault shares. Async for Dynamic vaults.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
      shares: { type: string, required: true, description: Share token amount }
    outputs:
      result: { type: object, description: Transaction receipt }

  - name: get-balance
    description: Get vault share token balance.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
      user: { type: string, required: true, description: User address }
    outputs:
      result: { type: string, description: Share balance }

  - name: get-asset-balance
    description: Get underlying stablecoin equivalent of share balance.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
      user: { type: string, required: true, description: User address }
    outputs:
      result: { type: string, description: Asset balance }

  - name: get-exchange-rate
    description: Get current share-to-asset exchange rate.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
    outputs:
      result: { type: string, description: Exchange rate }

  - name: get-vault-info
    description: Get vault metadata (name, type, state, rates, total assets).
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
    outputs:
      result:
        {
          type: object,
          description: '{name, symbol, poolType, state, underlyingAsset, exchangeRate, totalAssets}',
        }

  - name: is-permitted
    description: Check if an address is KYC-whitelisted for the vault.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
      user: { type: string, required: true, description: Address to check }
    outputs:
      result: { type: string, description: 'true or false' }

  - name: get-pool-overview
    description: Get pool health metrics.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
    outputs:
      result:
        {
          type: object,
          description: '{totalAssets, availableAssets, exchangeRate, pendingWithdrawals}',
        }

  - name: release-withdrawal
    description: Release a settled withdrawal from a PoolFlex vault.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
      event-id: { type: string, required: true, description: Withdrawal event ID from request-redeem }
    outputs:
      result: { type: object, description: Transaction receipt }

  - name: get-active-withdraws
    description: Get pending async withdrawal requests for a PoolDynamic vault.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
    outputs:
      result: { type: string, description: Array of active withdrawal event IDs }

  - name: get-account-state
    description: Get full user position (shares, assets, pending withdrawals).
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
      user: { type: string, required: true, description: User address }
    outputs:
      result: { type: object, description: Account state tuple }

  - name: convert-to-shares
    description: Convert an asset amount to equivalent vault shares.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
      amount: { type: string, required: true, description: Asset amount in base units }
    outputs:
      result: { type: string, description: Equivalent share amount }

  - name: get-interest-rate
    description: Get the current yield/interest rate for a vault.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
    outputs:
      result: { type: string, description: Interest rate }

  - name: get-max-deposit
    description: Get the maximum deposit allowed for a user.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
      user: { type: string, required: true, description: User address }
    outputs:
      result: { type: string, description: Maximum deposit amount }

  - name: get-max-redeem
    description: Get the maximum redeemable shares for a user.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
      user: { type: string, required: true, description: User address }
    outputs:
      result: { type: string, description: Maximum redeemable shares }

  - name: preview-redeem
    description: Preview the output of a redemption request.
    inputs:
      vault: { type: string, required: true, description: Vault address or symbol }
      shares: { type: string, required: true, description: Share amount to preview }
    outputs:
      result: { type: string, description: Expected asset output }

# ── Display metadata for W3 Explorer + AI agents ─────────────────────
# Templating: {{ path.to.value | filter | filter2 }}. See
# w3-action-template/docs/display-schema.md for the canonical reference.
display:
  brand:
    name: "OpenTrade"
    short_name: "OpenTrade"
    description: "Institutional yield vaults · Treasury, MMF, corporate credit"
    logo: "https://raw.githubusercontent.com/w3-io/w3-opentrade-action/main/assets/logo.svg"
    color: "#2563EB"

  commands:
    deposit:
      icon: "vault"
      title_template: "Deposit to {{ inputs.vault | known_contract_short }}"
      subtitle_template: "{{ inputs.amount | format_usdc_base }} → {{ inputs.network | chain_pretty }}"
      summary:
        - { label: "Vault", value: "{{ inputs.vault | known_contract_brand }}" }
        - { label: "Amount", value: "{{ inputs.amount | format_usdc_base }}" }
        - { label: "Network", value: "{{ inputs.network | chain_pretty }}" }
        - { label: "Tx", value: "{{ outputs.result.txHash | truncate_addr }}" }
      tx_hash_path: "outputs.result.txHash"
      chain_explorer:
        ethereum: "https://etherscan.io/tx/{{tx_hash}}"
        avalanche: "https://snowtrace.io/tx/{{tx_hash}}"
        plume: "https://explorer.plume.org/tx/{{tx_hash}}"

    request-redeem:
      icon: "redeem"
      title_template: "Redeem {{ inputs.vault | known_contract_short }}"
      subtitle_template: "{{ inputs.shares }} shares"
      summary:
        - { label: "Vault", value: "{{ inputs.vault | known_contract_brand }}" }
        - { label: "Shares", value: "{{ inputs.shares }}" }
        - { label: "Tx", value: "{{ outputs.result.txHash | truncate_addr }}" }
      tx_hash_path: "outputs.result.txHash"

    get-balance:
      icon: "info"
      title_template: "Position in {{ inputs.vault | known_contract_short }}"
      subtitle_template: "{{ inputs.user | truncate_addr }}"
      summary:
        - { label: "Vault", value: "{{ inputs.vault | known_contract_brand }}" }
        - { label: "User", value: "{{ inputs.user | truncate_addr }}" }
        - { label: "Shares", value: "{{ outputs.result }}" }

    get-asset-balance:
      icon: "info"
      title_template: "USDC value in {{ inputs.vault | known_contract_short }}"
      subtitle_template: "{{ inputs.user | truncate_addr }}"
      summary:
        - { label: "Vault", value: "{{ inputs.vault | known_contract_brand }}" }
        - { label: "Underlying", value: "{{ outputs.result | format_usdc_base }}" }

    get-exchange-rate:
      icon: "chart"
      title_template: "Exchange rate · {{ inputs.vault | known_contract_short }}"
      subtitle_template: "shares → assets"
      summary:
        - { label: "Vault", value: "{{ inputs.vault | known_contract_brand }}" }
        - { label: "Rate", value: "{{ outputs.result | format_rate }}" }

    get-vault-info:
      icon: "info"
      title_template: "{{ inputs.vault | known_contract_short }} info"
      summary:
        - { label: "Name", value: "{{ outputs.result.name }}" }
        - { label: "Symbol", value: "{{ outputs.result.symbol }}" }
        - { label: "State", value: "{{ outputs.result.state }}" }
        - { label: "Exchange rate", value: "{{ outputs.result.exchangeRate | format_rate }}" }
        - { label: "Total assets", value: "{{ outputs.result.totalAssets | format_usdc_base }}" }

    is-permitted:
      icon: "check"
      title_template: "KYC check · {{ inputs.vault | known_contract_short }}"
      subtitle_template: "{{ inputs.user | truncate_addr }}"
      summary:
        - { label: "Vault", value: "{{ inputs.vault | known_contract_brand }}" }
        - { label: "Wallet", value: "{{ inputs.user | truncate_addr }}" }
        - { label: "Permitted", value: "{{ outputs.result }}" }

    get-pool-overview:
      icon: "chart"
      title_template: "Pool overview · {{ inputs.vault | known_contract_short }}"
      summary:
        - { label: "Vault", value: "{{ inputs.vault | known_contract_brand }}" }
        - { label: "Total assets", value: "{{ outputs.result.totalAssets | format_usdc_base }}" }
        - { label: "Available", value: "{{ outputs.result.totalAvailableAssets | format_usdc_base }}" }
        - { label: "Pending withdrawals", value: "{{ outputs.result.pendingWithdrawals | format_usdc_base }}" }
